name: Site checks

on:
  push:
    branches: [dev/v31-evolucao-total]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Audit international SEO metadata
        run: |
          node scripts/seo-audit.cjs > /tmp/humildadever-seo-audit.json
          node -e 'const r=require("/tmp/humildadever-seo-audit.json"); console.log(JSON.stringify(r.summary)); if (!r.summary || !Array.isArray(r.checks)) process.exit(1)'
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser
        env:
          SITE_TEST_BROWSER: ${{ matrix.browser }}
